<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Sistem Keuangan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Premium Blue: Inter (body 400/500/600/700) + Hanken Grotesk (display 500/600/700/800) -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    <!-- Preload logo splash agar unduhannya bisa dihitung & lebih cepat masuk -->
    <link rel="preload" as="image" href="/asik-logo.png" fetchpriority="high" fetchprio="high">
    <script>
      // Terapkan tema sejak paint pertama (hilangkan FOUC) — replika logika ThemeContext
      (function () {
        try {
          window.__BOOT_T0 = performance.now();          // titik nol pemuatan
          var t = localStorage.getItem('spj_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <style>
      /* ── Boot splash — animasi loading saat aplikasi dibuka ── */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #F3F5F9;
        transition: opacity 0.5s ease;
      }
      html.dark #boot-splash { background: #0F172A; }
      .boot-hide { opacity: 0; pointer-events: none; }

      /* ── ASIK Animated Loader — paste into your app stylesheet ── */
      .asik-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        text-align: center;
        color: #203b60;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .asik-loader {
        width: 116px; height: 116px; position: relative;
        display: grid; place-items: center; isolation: isolate;
      }
      .asik-loader__halo {
        position: absolute; inset: 9px; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 14%, rgba(18,220,232,.15) 20%, rgba(7,87,238,.13) 45%, transparent 68%);
        filter: blur(9px); animation: asik-halo-pulse 2.6s ease-in-out infinite; z-index: -1;
      }
      .asik-loader__rings { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .asik-loader__track { fill: none; stroke: #dce9fb; stroke-width: 2; }
      .asik-loader__ring {
        fill: none; stroke: url(#asik-ring-gradient); stroke-width: 5.5; stroke-linecap: round;
        stroke-dasharray: 155 210; transform-origin: 60px 60px;
        animation: asik-orbit 2.5s cubic-bezier(.65,0,.35,1) infinite, asik-dash 2.1s ease-in-out infinite;
      }
      .asik-loader__ring--secondary {
        stroke-width: 2.4; stroke-dasharray: 62 298;
        animation: asik-orbit-reverse 4.4s linear infinite, asik-secondary-dash 2.8s ease-in-out infinite;
        opacity: .88;
      }
      .asik-loader__disc {
        position: relative; width: 84px; height: 84px; border-radius: 50%;
        display: grid; place-items: center; background: rgba(255,255,255,.94);
        border: 1px solid rgba(217,231,251,.95);
        box-shadow: 0 5px 18px rgba(38,100,185,.08), inset 0 1px 0 rgba(255,255,255,.95);
        animation: asik-disc-float 2.8s ease-in-out infinite;
      }
      .asik-loader__logo { width: 67px; height: auto; object-fit: contain; animation: asik-logo-breath 2.8s ease-in-out infinite; }
      .asik-loading__dots { display: flex; justify-content: center; gap: 7px; }
      .asik-loading__dots span {
        width: 7px; height: 7px; border-radius: 50%;
        background: linear-gradient(135deg, #0757ee, #12dce8);
        opacity: .3; animation: asik-dot-wave 1.25s ease-in-out infinite;
      }
      .asik-loading__dots span:nth-child(2) { animation-delay: .16s; }
      .asik-loading__dots span:nth-child(3) { animation-delay: .32s; }
      .asik-loading__title { margin: 0; font-size: 15px; font-weight: 650; }
      .asik-loading__subtitle { margin: -5px 0 0; font-size: 12px; color: #7b8da7; }
      @keyframes asik-orbit { 0%{transform:rotate(-35deg)} 50%{transform:rotate(160deg)} 100%{transform:rotate(325deg)} }
      @keyframes asik-dash { 0%,100%{stroke-dasharray:155 210;stroke-dashoffset:0} 50%{stroke-dasharray:85 280;stroke-dashoffset:-36} }
      @keyframes asik-orbit-reverse { to{transform:rotate(-360deg)} }
      @keyframes asik-secondary-dash { 0%,100%{stroke-dasharray:62 298;stroke-dashoffset:0} 50%{stroke-dasharray:115 245;stroke-dashoffset:-42} }
      @keyframes asik-disc-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
      @keyframes asik-logo-breath { 0%,100%{transform:scale(.97);opacity:.94} 50%{transform:scale(1);opacity:1} }
      @keyframes asik-halo-pulse { 0%,100%{opacity:.5;transform:scale(.95)} 50%{opacity:.95;transform:scale(1.06)} }
      @keyframes asik-dot-wave { 0%,60%,100%{transform:translateY(0);opacity:.28} 30%{transform:translateY(-4px);opacity:1} }
      /* (selector utk pseudo-elemen dibetulkan agar rule valid & benar2 diterapkan) */
      @media (prefers-reduced-motion: reduce) {
        .asik-loading *, .asik-loading ::before, .asik-loading ::after {
          animation-duration: .01ms !important; animation-iteration-count: 1 !important;
        }
      }

      /* ── Adaptasi: tema gelap + logo berupa SVG inline (bukan file img) ── */
      html.dark .asik-loading { color: #E2E8F0; }
      html.dark .asik-loading__title { color: #F1F5F9; }
      html.dark .asik-loading__subtitle { color: #94A3B8; }
      html.dark .asik-loader__track { stroke: rgba(148, 163, 184, 0.22); }
      html.dark .asik-loader__disc {
        background: rgba(30, 41, 59, 0.94);
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      html.dark .asik-loader__logo { filter: brightness(1.22) saturate(1.05); }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="asik-loading">
        <div class="asik-loader">
          <span class="asik-loader__halo"></span>
          <svg class="asik-loader__rings" viewBox="0 0 120 120">
            <defs>
              <linearGradient id="asik-ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0757EE"/>
                <stop offset="55%" stop-color="#0AA5EE"/>
                <stop offset="100%" stop-color="#12DCE8"/>
              </linearGradient>
            </defs>
            <circle class="asik-loader__track" cx="60" cy="60" r="57"/>
            <circle class="asik-loader__ring" cx="60" cy="60" r="57"/>
            <circle class="asik-loader__ring asik-loader__ring--secondary" cx="60" cy="60" r="57"/>
          </svg>
          <div class="asik-loader__disc">
            <img class="asik-loader__logo" src="/asik-logo.png" alt="ASIK" draggable="false" />
          </div>
        </div>
        <div class="asik-loading__dots"><span></span><span></span><span></span></div>
        <p class="asik-loading__title">Aplikasi Sistem Keuangan</p>
        <p class="asik-loading__subtitle">Pertanggungjawaban Dana BOS/BOSP</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
