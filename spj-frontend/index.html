<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Dokumentasi LPJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Premium Blue: Inter (body 400/500/600/700) + Hanken Grotesk (display 500/600/700/800) -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    <!-- Preload logo splash agar unduhannya bisa dihitung & lebih cepat masuk -->
    <link rel="preload" as="image" href="/asik-logo.png" fetchpriority="high" fetchprio="high">
    <script>
      // Terapkan tema sejak paint pertama (hilangkan FOUC) — replika logika ThemeContext
      (function () {
        try {
          window.__BOOT_T0 = performance.now();          // titik nol pemuatan
          var t = localStorage.getItem('spj_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <style>
      /* ── Boot splash — animasi loading saat aplikasi dibuka ── */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #F3F5F9;
        transition: opacity 0.5s ease-out;
        will-change: opacity;
      }
      html.dark #boot-splash { background: #0F172A; }
      .boot-hide {
        opacity: 0;
        pointer-events: none;
      }

      /* ── ASIK Animated Loader — paste into your app stylesheet ── */
      .asik-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        color: #203b60;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .asik-loader {
        width: 140px; height: 140px; position: relative;
        display: grid; place-items: center; isolation: isolate;
      }
      .asik-loader__halo {
        position: absolute; inset: 9px; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 14%, rgba(18,220,232,.15) 20%, rgba(7,87,238,.13) 45%, transparent 68%);
        filter: blur(9px); animation: asik-halo-pulse 3s ease-in-out infinite; z-index: -1;
      }
      /* Track: lingkaran penuh statis, sangat samar — memberi struktur */
      .asik-loader__track {
        position: absolute; inset: 0; border-radius: 50%;
        background: rgba(7,87,238,.12);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px), #000 calc(100% - 5px), transparent calc(100% - 4px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px), #000 calc(100% - 5px), transparent calc(100% - 4px));
      }
      /* Komet: ekor memudar halus (conic gradient), bukan batang arc berujung tajam.
         Wrapper berputar linear; ::before = pita bersaput; ::after = titik kepala bercahaya. */
      .asik-loader__comet {
        position: absolute; inset: 0; border-radius: 50%;
        animation: asik-orbit 1.5s linear infinite;
        filter: drop-shadow(0 0 6px rgba(10,165,238,.45));
      }
      .asik-loader__comet::before {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg,
          rgba(125,249,255,0) 0deg, rgba(125,249,255,0) 40deg,
          rgba(18,220,232,.08) 110deg, rgba(10,165,238,.35) 190deg,
          rgba(7,87,238,.72) 270deg, #12DCE8 330deg, #7DF9FF 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px), #000 calc(100% - 4px), transparent calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px), #000 calc(100% - 4px), transparent calc(100% - 3px));
      }
      .asik-loader__comet::after {
        content: ''; position: absolute; top: 3px; left: 50%;
        width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
        background: #BFFBFF; box-shadow: 0 0 10px #12DCE8, 0 0 22px rgba(18,220,232,.6);
      }
      .asik-loader__disc {
        position: relative; width: 100px; height: 100px; border-radius: 50%;
        display: grid; place-items: center; background: rgba(255,255,255,.94);
        border: 1px solid rgba(217,231,251,.95);
        box-shadow: 0 5px 18px rgba(38,100,185,.08), inset 0 1px 0 rgba(255,255,255,.95);
        animation: asik-disc-float 3s ease-in-out infinite;
      }
      .asik-loader__logo { width: 80px; height: auto; object-fit: contain; animation: asik-logo-breath 3s ease-in-out infinite; }
      .asik-loading__dots { display: flex; justify-content: center; gap: 7px; }
      .asik-loading__dots span {
        width: 7px; height: 7px; border-radius: 50%;
        background: linear-gradient(135deg, #0757ee, #12dce8);
        opacity: .3; animation: asik-dot-wave 1.25s ease-in-out infinite;
      }
      .asik-loading__dots span:nth-child(2) { animation-delay: .16s; }
      .asik-loading__dots span:nth-child(3) { animation-delay: .32s; }
      .asik-loading__title { margin: 0; font-size: 15px; font-weight: 650; }
      .asik-loading__subtitle { margin: -5px 0 0; font-size: 12px; color: #7b8da7; }
      @keyframes asik-orbit { to { transform: rotate(360deg); } }
      @keyframes asik-disc-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
      @keyframes asik-logo-breath { 0%,100%{transform:scale(.97);opacity:.94} 50%{transform:scale(1);opacity:1} }
      @keyframes asik-halo-pulse { 0%,100%{opacity:.5;transform:scale(.95)} 50%{opacity:.95;transform:scale(1.06)} }
      @keyframes asik-dot-wave { 0%,60%,100%{transform:translateY(0);opacity:.28} 30%{transform:translateY(-4px);opacity:1} }
      /* (selector utk pseudo-elemen dibetulkan agar rule valid & benar2 diterapkan) */
      @media (prefers-reduced-motion: reduce) {
        .asik-loading *, .asik-loading ::before, .asik-loading ::after {
          animation-duration: .01ms !important; animation-iteration-count: 1 !important;
        }
      }

      /* ── Adaptasi: tema gelap + logo berupa SVG inline (bukan file img) ── */
      html.dark .asik-loading { color: #E2E8F0; }
      html.dark .asik-loading__title { color: #F8FAFC; }
      html.dark .asik-loading__subtitle { color: #94A3B8; }
      html.dark .asik-loader__track { background: rgba(148, 163, 184, 0.18); }
      html.dark .asik-loader__disc {
        background: rgba(30, 41, 59, 0.94);
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      html.dark .asik-loader__logo { filter: brightness(1.22) saturate(1.05); }
    </style>
    <!-- ── FAIL-SAFE: splash tidak boleh bisa nyangkut selamanya, apa pun yang terjadi ──
         Berjalan di HTML murni (tidak butuh React). Kalau React gagal mount (error module,
         server dev lambat, cache tab), splash dipaksa hilang dan pesan diberikan. -->
    <script>
      (function () {
        var armed = false;
        function failSafe() {
          armed = true;
          var s = document.getElementById('boot-splash');
          if (s) { s.classList.add('boot-hide'); setTimeout(function () { if (s.parentNode) s.remove(); }, 700); }
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && !root.hasChildNodes()) {
              var note = document.createElement('div');
              note.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99998;background:#0F172A;color:#F8FAFC;padding:10px 16px;border-radius:10px;font:500 13px Inter,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3)';
              note.textContent = 'Aplikasi gagal termuat — muat ulang halaman (Ctrl+Shift+R) atau jalankan ulang dev server.';
              document.body.appendChild(note);
              // React bisa selesai mount setelah timer: pesan harus hilang begitu root terisi.
              var watcher = new MutationObserver(function () {
                if (root.hasChildNodes()) { note.remove(); watcher.disconnect(); }
              });
              watcher.observe(root, { childList: true });
            }
          }, 1200);
        }
        setTimeout(failSafe, 6500);
        // Resource error (font/image/CDN) tidak boleh dianggap React gagal mount.
        // Timer di atas tetap menjadi fallback jika root benar-benar kosong.
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="asik-loading">
        <div class="asik-loader">
          <span class="asik-loader__halo"></span>
          <span class="asik-loader__track"></span>
          <span class="asik-loader__comet"></span>
          <div class="asik-loader__disc">
            <img class="asik-loader__logo" src="/asik-logo.png" alt="ASIK" draggable="false" />
          </div>
        </div>
        <div class="asik-loading__dots"><span></span><span></span><span></span></div>
        <p class="asik-loading__title">Aplikasi Dokumentasi LPJ</p>
        <p class="asik-loading__subtitle">Pertanggungjawaban Dana BOS/BOSP</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
